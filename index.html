<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0xmanthan</title>
<meta name="description" content="Manthan Sharma — software engineer. Hello.">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --accent: #ea580c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --accent: #fb923c; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main { text-align: center; max-width: 40rem; }
  .hello {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Devanagari",
                 "Noto Sans JP", "Noto Sans KR", "Noto Sans SC", "Noto Sans Arabic", sans-serif;
    font-size: clamp(3rem, 12vw, 6.5rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.15;
    min-height: 1.3em; margin: 0;
    transition: opacity .7s cubic-bezier(.4,0,.2,1), filter .7s cubic-bezier(.4,0,.2,1), transform .7s cubic-bezier(.4,0,.2,1);
    will-change: opacity, filter, transform;
  }
  .hello.out { opacity: 0; filter: blur(12px); transform: scale(.96); }
  @media (prefers-reduced-motion: reduce) {
    .hello { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1 class="hello" id="hello" aria-live="polite">Hello</h1>
</main>
<script>
  const greetings = [
    ["Hello", "english", "en"], ["नमस्ते", "hindi", "hi"], ["Hola", "spanish", "es"],
    ["Bonjour", "french", "fr"], ["こんにちは", "japanese", "ja"], ["안녕하세요", "korean", "ko"],
    ["你好", "chinese", "zh"], ["Ciao", "italian", "it"], ["Olá", "portuguese", "pt"],
    ["Hallo", "german", "de"], ["Привет", "russian", "ru"], ["مرحبا", "arabic", "ar"],
    ["வணக்கம்", "tamil", "ta"], ["ਸਤ ਸ੍ਰੀ ਅਕਾਲ", "punjabi", "pa"], ["নমস্কার", "bengali", "bn"],
    ["Merhaba", "turkish", "tr"], ["Γειά σου", "greek", "el"], ["שלום", "hebrew", "he"],
    ["Jambo", "swahili", "sw"], ["Hej", "swedish", "sv"]
  ];
  const h = document.getElementById("hello");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;
  setInterval(() => {
    i = (i + 1) % greetings.length;
    const [word, , code] = greetings[i];
    const swap = () => { h.textContent = word; h.lang = code; h.classList.remove("out"); };
    if (reduce) return swap();
    h.classList.add("out");
    setTimeout(swap, 700);
  }, 2800);
</script>
</body>
</html>
